name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.ruby-version }})
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 10
    env:
      BUNDLE_GEMFILE: Gemfile
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu, ruby-version: '2.6' }
        - { os: ubuntu, ruby-version: '2.7' }
        - { os: ubuntu, ruby-version: '3.0' }
        - { os: ubuntu, ruby-version: '3.1' }
        - { os: ubuntu, ruby-version: '3.2' }
        - { os: ubuntu, ruby-version: '3.3' }
        - { os: ubuntu, ruby-version: '3.4' }
        - { os: ubuntu, ruby-version: '4.0' }
        - { os: macos, ruby-version: '2.6' }
        - { os: macos, ruby-version: '3.2' }
        - { os: macos, ruby-version: '4.0' }
        - { os: windows, ruby-version: '3.2' }
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Install libcurl
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$env:RI_DEVKIT\usr\bin\bash.exe" -lc "pacman -S --noconfirm mingw-w64-ucrt-x86_64-curl"
        $bin = Join-Path $env:RI_DEVKIT "ucrt64\bin"
        # FFI does not always search PATH on Windows. Keep copies named
        # libcurl.dll, which Ethon tries first, next to the dependency DLLs
        # and in the workspace.
        Copy-Item (Join-Path $bin "libcurl-4.dll") (Join-Path $bin "libcurl.dll")
        Copy-Item (Join-Path $bin "libcurl-4.dll") (Join-Path $env:GITHUB_WORKSPACE "libcurl.dll")
        $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Run tests
      shell: bash
      run: |
        if [[ $(ruby -e 'puts RUBY_ENGINE') == 'ruby' ]]; then
          export RUBYOPT='--enable=frozen-string-literal --debug=frozen-string-literal'
        fi
        bundle exec rake

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.ruby-version }})
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 10
    env:
      BUNDLE_GEMFILE: Gemfile
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu, ruby-version: '2.6' }
        - { os: ubuntu, ruby-version: '2.7' }
        - { os: ubuntu, ruby-version: '3.0' }
        - { os: ubuntu, ruby-version: '3.1' }
        - { os: ubuntu, ruby-version: '3.2' }
        - { os: ubuntu, ruby-version: '3.3' }
        - { os: ubuntu, ruby-version: '3.4' }
        - { os: ubuntu, ruby-version: '4.0' }
        - { os: macos, ruby-version: '2.6' }
        - { os: macos, ruby-version: '3.2' }
        - { os: macos, ruby-version: '4.0' }
        - { os: windows, ruby-version: '3.2' }
    steps:
    - uses: actions/checkout@v7
    - name: Install libcurl
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP "curl.zip"
        Invoke-WebRequest -Uri "https://curl.se/windows/latest.cgi?p=win64-mingw.zip" -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP\curl"
        $lib = Get-ChildItem "$env:RUNNER_TEMP\curl" -Recurse -Filter libcurl-x64.dll |
          Select-Object -First 1
        # Ethon 0.18 only looks for libcurl.dll on Windows.
        Copy-Item $lib.FullName (Join-Path $lib.DirectoryName "libcurl.dll")
        $lib.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run tests
      shell: bash
      run: |
        if [[ $(ruby -e 'puts RUBY_ENGINE') == 'ruby' ]]; then
          export RUBYOPT='--enable=frozen-string-literal --debug=frozen-string-literal'
        fi
        bundle exec rake

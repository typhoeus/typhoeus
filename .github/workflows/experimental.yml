name: Experimental
on: [push, pull_request]
jobs:
  build:
    env:
      BUNDLE_GEMFILE: Gemfile
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        ruby-version:
          - ruby-head
          - jruby-head
          - truffleruby-head
    steps:
      - uses: actions/checkout@v6
      - name: Install libcurl header
        run: |
          if ${{ matrix.os == 'macos' }}
          then
            brew install curl
          else
            sudo apt update && sudo apt install -y --no-install-recommends libcurl4-openssl-dev
          fi
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: |
          if [[ $(ruby -e 'puts RUBY_ENGINE') == 'ruby' ]]; then
            export RUBYOPT='--enable=frozen-string-literal --debug=frozen-string-literal'
          fi
          bundle exec rake
